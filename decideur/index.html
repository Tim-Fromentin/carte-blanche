<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Décideur</title>
<meta name="description" content="Tu hésites entre plusieurs options ? Note-les sur ce qui compte pour toi, le Décideur fait le calcul. Résultat partageable par lien.">
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --text: #22201c; --muted: #77716a;
    --border: #e7e1d7; --accent: #6d28d9; --accent-soft: #ede5fb; --gold: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141218; --card: #1d1a22; --text: #ece8f2; --muted: #a39dad;
      --border: #322d3a; --accent: #a78bfa; --accent-soft: #2a2140; --gold: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font-size: 1.8rem; margin: 0; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 4px 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; margin-bottom: 16px;
  }
  .question {
    width: 100%; border: none; background: none; color: var(--text);
    font: 700 1.4rem system-ui, sans-serif; padding: 4px 0; border-bottom: 2px dashed var(--border);
  }
  .question:focus { outline: none; border-bottom-color: var(--accent); }
  .scroller { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  table { border-collapse: separate; border-spacing: 6px; min-width: 100%; }
  th { font-weight: 600; text-align: left; vertical-align: bottom; }
  td, th { padding: 0; }
  input[type=text], input[type=number] {
    width: 100%; height: 38px; padding: 0 10px; font: inherit;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  th input[type=text] { font-weight: 600; min-width: 110px; }
  td.crit input[type=text] { min-width: 140px; }
  input[type=number] { width: 64px; text-align: center; }
  .weight { display: flex; gap: 2px; }
  .weight button {
    width: 22px; height: 38px; padding: 0; border: none; background: none; cursor: pointer;
    font-size: 1rem; color: var(--border);
  }
  .weight button.on { color: var(--gold); }
  .small { font-size: .75rem; color: var(--muted); font-weight: 500; }
  .x { border: none; background: none; color: var(--muted); cursor: pointer; font-size: .9rem; padding: 0 4px; }
  .x:hover { color: #dc2626; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button.btn {
    height: 38px; padding: 0 14px; font: inherit; cursor: pointer;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text);
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .results h2 { margin: 0 0 14px; font-size: 1.1rem; }
  .bar { margin-bottom: 12px; }
  .bar .head { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .bar .track { height: 12px; border-radius: 6px; background: var(--accent-soft); overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 6px; background: var(--accent); transition: width .3s; }
  .bar.winner .head span:first-child::before { content: "🏆 "; }
  .verdict { margin: 14px 0 0; padding: 12px 14px; background: var(--accent-soft); border-radius: 10px; }
  .hint { color: var(--muted); font-size: .85rem; margin: 10px 0 0; }
</style>
</head>
<body>
<main>
  <h1>⚖️ Le Décideur</h1>
  <p class="sub">Donne une importance à chaque critère (★), note chaque option de 0 à 10. Le calcul fait le reste.</p>

  <section class="card">
    <input class="question" id="question" aria-label="Ta question" placeholder="Quelle décision dois-tu prendre ?">
    <div class="scroller" style="margin-top: 16px">
      <table id="table"></table>
    </div>
    <div class="row-actions">
      <button class="btn" id="addOption">+ Option</button>
      <button class="btn" id="addCriterion">+ Critère</button>
      <button class="btn" id="example">Exemple</button>
      <button class="btn" id="reset">Tout effacer</button>
    </div>
  </section>

  <section class="card results" id="results">
    <h2>Résultat</h2>
    <div id="bars"></div>
    <p class="verdict" id="verdict"></p>
    <div class="row-actions">
      <button class="btn primary" id="share">🔗 Partager cette décision</button>
    </div>
    <p class="hint">Le lien contient toute la décision : envoie-le pour que d'autres modifient les notes de leur côté.</p>
  </section>
</main>

<script src="../shared/badge.js" data-n="3" defer></script>
<script>
  const $ = (id) => document.getElementById(id);
  const STORAGE_KEY = 'decideur';
  const MAX_OPTIONS = 6, MAX_CRITERIA = 10;

  const EXAMPLE = {
    question: 'Quel ordinateur portable acheter ?',
    options: ['Modèle A', 'Modèle B', 'Modèle C'],
    criteria: [
      { name: 'Prix', weight: 5 }, { name: 'Autonomie', weight: 4 },
      { name: 'Poids', weight: 3 }, { name: 'Écran', weight: 2 },
    ],
    scores: [[8, 5, 6], [6, 9, 7], [5, 8, 9], [6, 9, 7]],
  };

  const EMPTY = {
    question: '', options: ['Option 1', 'Option 2'],
    criteria: [{ name: 'Critère 1', weight: 3 }, { name: 'Critère 2', weight: 3 }],
    scores: [[5, 5], [5, 5]],
  };

  let state = structuredClone(EXAMPLE);

  // ---------- Lien partageable (JSON → base64url) ----------
  function encode(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    let bin = '';
    bytes.forEach((b) => { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function decode(text) {
    const bin = atob(text.replace(/-/g, '+').replace(/_/g, '/'));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
  }

  function valid(s) {
    return s && Array.isArray(s.options) && Array.isArray(s.criteria) && Array.isArray(s.scores)
      && s.scores.length === s.criteria.length && s.scores.every((row) => row.length === s.options.length);
  }

  function persist() {
    history.replaceState(null, '', '#' + encode(state));
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch { /* stockage indisponible */ }
  }

  // ---------- Calcul ----------
  function results() {
    const totalWeight = state.criteria.reduce((sum, c) => sum + c.weight, 0) || 1;
    return state.options.map((name, o) => ({
      name,
      score: state.criteria.reduce((sum, c, k) => sum + c.weight * state.scores[k][o], 0) / totalWeight,
    }));
  }

  // ---------- Affichage ----------
  function input(type, value, onInput, attrs = {}) {
    const node = document.createElement('input');
    node.type = type;
    node.value = value;
    Object.assign(node, attrs);
    node.addEventListener('input', () => { onInput(node.value); persist(); renderResults(); });
    return node;
  }

  function removeButton(label, onClick) {
    const b = document.createElement('button');
    b.className = 'x';
    b.textContent = '✕';
    b.setAttribute('aria-label', label);
    b.addEventListener('click', onClick);
    return b;
  }

  function renderTable() {
    const table = $('table');
    table.replaceChildren();

    const head = document.createElement('tr');
    const corner = document.createElement('th');
    corner.innerHTML = '<span class="small">Critères ↓ · Options →</span>';
    const weightHead = document.createElement('th');
    weightHead.innerHTML = '<span class="small">Importance</span>';
    head.append(corner, weightHead);
    state.options.forEach((name, o) => {
      const th = document.createElement('th');
      const wrap = document.createElement('div');
      wrap.style.display = 'flex';
      wrap.append(input('text', name, (v) => { state.options[o] = v; }, { 'aria-label': `Option ${o + 1}` }));
      if (state.options.length > 2) {
        wrap.append(removeButton('Supprimer cette option', () => {
          state.options.splice(o, 1);
          state.scores.forEach((row) => row.splice(o, 1));
          persist(); render();
        }));
      }
      th.append(wrap);
      head.append(th);
    });
    table.append(head);

    state.criteria.forEach((c, k) => {
      const tr = document.createElement('tr');
      const name = document.createElement('td');
      name.className = 'crit';
      const wrap = document.createElement('div');
      wrap.style.display = 'flex';
      wrap.append(input('text', c.name, (v) => { c.name = v; }, { 'aria-label': `Critère ${k + 1}` }));
      if (state.criteria.length > 1) {
        wrap.append(removeButton('Supprimer ce critère', () => {
          state.criteria.splice(k, 1);
          state.scores.splice(k, 1);
          persist(); render();
        }));
      }
      name.append(wrap);

      const weight = document.createElement('td');
      const stars = document.createElement('div');
      stars.className = 'weight';
      for (let w = 1; w <= 5; w++) {
        const star = document.createElement('button');
        star.textContent = '★';
        star.className = w <= c.weight ? 'on' : '';
        star.setAttribute('aria-label', `Importance ${w} sur 5`);
        star.addEventListener('click', () => { c.weight = w; persist(); render(); });
        stars.append(star);
      }
      weight.append(stars);
      tr.append(name, weight);

      state.options.forEach((_, o) => {
        const td = document.createElement('td');
        td.append(input('number', state.scores[k][o], (v) => {
          state.scores[k][o] = Math.min(10, Math.max(0, Number(v) || 0));
        }, { min: 0, max: 10, step: 1, 'aria-label': `Note de ${state.options[o]} pour ${c.name}` }));
        tr.append(td);
      });
      table.append(tr);
    });
  }

  function renderResults() {
    const list = results().sort((a, b) => b.score - a.score);
    const best = list[0];
    const tie = list.filter((r) => Math.abs(r.score - best.score) < 0.05);
    $('bars').replaceChildren(...list.map((r, i) => {
      const bar = document.createElement('div');
      bar.className = 'bar' + (i === 0 && tie.length === 1 ? ' winner' : '');
      const head = document.createElement('div');
      head.className = 'head';
      const name = document.createElement('span');
      name.textContent = r.name || '(sans nom)';
      const score = document.createElement('span');
      score.textContent = r.score.toFixed(1).replace('.', ',') + ' / 10';
      head.append(name, score);
      const track = document.createElement('div');
      track.className = 'track';
      const fill = document.createElement('div');
      fill.className = 'fill';
      fill.style.width = `${r.score * 10}%`;
      track.append(fill);
      bar.append(head, track);
      return bar;
    }));

    const second = list[1];
    if (tie.length > 1) {
      $('verdict').textContent = `Égalité entre ${tie.map((r) => r.name).join(' et ')}. Ajoute un critère ou revois l'importance de ceux qui comptent vraiment.`;
    } else {
      const gap = best.score - second.score;
      $('verdict').textContent = gap < 0.5
        ? `${best.name} l'emporte de justesse. Écoute ton intuition : si tu es déçu par ce résultat, c'est peut-être l'autre que tu voulais.`
        : `${best.name} l'emporte nettement, avec ${gap.toFixed(1).replace('.', ',')} point${gap >= 2 ? 's' : ''} d'avance.`;
    }
  }

  function render() {
    $('question').value = state.question;
    $('addOption').disabled = state.options.length >= MAX_OPTIONS;
    $('addCriterion').disabled = state.criteria.length >= MAX_CRITERIA;
    renderTable();
    renderResults();
  }

  // ---------- Événements ----------
  $('question').addEventListener('input', (e) => { state.question = e.target.value; persist(); });
  $('addOption').addEventListener('click', () => {
    state.options.push(`Option ${state.options.length + 1}`);
    state.scores.forEach((row) => row.push(5));
    persist(); render();
  });
  $('addCriterion').addEventListener('click', () => {
    state.criteria.push({ name: `Critère ${state.criteria.length + 1}`, weight: 3 });
    state.scores.push(state.options.map(() => 5));
    persist(); render();
  });
  $('example').addEventListener('click', () => { state = structuredClone(EXAMPLE); persist(); render(); });
  $('reset').addEventListener('click', () => { state = structuredClone(EMPTY); persist(); render(); });
  $('share').addEventListener('click', async () => {
    persist();
    try {
      if (navigator.share) await navigator.share({ title: state.question || 'Le Décideur', url: location.href });
      else {
        await navigator.clipboard.writeText(location.href);
        $('share').textContent = 'Lien copié ✓';
        setTimeout(() => ($('share').textContent = '🔗 Partager cette décision'), 1500);
      }
    } catch { /* partage annulé */ }
  });

  // Priorité : lien partagé, puis dernière décision enregistrée, puis exemple
  try {
    const fromUrl = location.hash.length > 1 ? decode(location.hash.slice(1)) : null;
    const fromStorage = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (valid(fromUrl)) state = fromUrl;
    else if (valid(fromStorage)) state = fromStorage;
  } catch { /* lien abîmé : on garde l'exemple */ }
  render();
</script>
</body>
</html>
